services:
  postgres:
    image: postgres:17-alpine
    container_name: roomkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomkit}
      POSTGRES_DB: ${POSTGRES_DB:-roomkit}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - roomkit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-roomkit} -d ${POSTGRES_DB:-roomkit}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomkit-pgdata:
