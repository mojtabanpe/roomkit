name: Deploy

# Runs only after CI went green on master, so a red build never reaches
# roomkit.ir. workflow_dispatch is the manual escape hatch (also used to
# re-deploy the current master without pushing a commit).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # For workflow_run, github.sha is already the tested commit, but be explicit
    # so the manual path and the automatic path build the same thing.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings if you want a
    # manual gate before production.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          # Named explicitly, because an unset secret is an empty string and
          # every later step then fails with something unrelated-looking.
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::could not reach $SSH_HOST:$SSH_PORT over SSH" >&2
            exit 1
          fi

      - name: Sync deploy files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude '.env' \
            deploy/ "$SSH_USER@$SSH_HOST:/opt/roomkit/"

      - name: Pull images and restart the stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            REGISTRY="$REGISTRY" REPO="$REPO" SHA="$SHA" \
            GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
            'bash -euo pipefail -s' <<'REMOTE'
            cd /opt/roomkit

            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

            # Pin this deploy to the exact commit; .env keeps every other
            # setting. The image lines are rewritten in place so a rollback is
            # just editing SHA here and re-running.
            sed -i -e "/^API_IMAGE=/d" -e "/^WEB_IMAGE=/d" .env
            {
              echo "API_IMAGE=$REGISTRY/$REPO-api:$SHA"
              echo "WEB_IMAGE=$REGISTRY/$REPO-web:$SHA"
            } >> .env

            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
          REMOTE

      - name: Verify the site answers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'for i in $(seq 1 20); do
               # Trailing slash matters: /api gets a 301 to /api/ from the
               # prefix location, and this check does not follow redirects.
               code=$(curl -sk -o /dev/null -w "%{http_code}" -H "Host: roomkit.ir" https://localhost/api/ || true)
               [ "$code" = "200" ] && echo "api is up" && exit 0
               sleep 3
             done
             echo "api did not become healthy" >&2
             docker compose -f /opt/roomkit/compose.prod.yaml logs --tail=50 api >&2
             exit 1'
