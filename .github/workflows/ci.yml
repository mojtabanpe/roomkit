name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected needs history to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - run: npx nx affected -t lint test build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roomkit
          POSTGRES_PASSWORD: roomkit
          POSTGRES_DB: roomkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomkit -d roomkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://roomkit:roomkit@localhost:5432/roomkit
      # api-e2e boots the real Nest app, so it needs a full config. These are
      # throwaway CI values, not secrets.
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRES_IN: 7d
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_URL: ws://localhost:7880
      CORS_ORIGIN: http://localhost:4200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx nx run api-e2e:e2e
