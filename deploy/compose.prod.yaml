# Production stack for roomkit.ir. Lives on the VPS at /opt/roomkit alongside a
# .env file (never committed — see .env.example for the keys it must contain).
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# The deploy workflow (.github/workflows/deploy.yml) runs exactly that after
# pushing fresh images to GHCR.

name: roomkit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published: only the api container talks to it.

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Escape hatch only. Migrations run at boot; see AGENTS.md → Migrations.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      USAGE_SWEEP_SECONDS: ${USAGE_SWEEP_SECONDS:-60}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Fixed here rather than in .env, and deliberately: the key *name* also
      # has to appear in deploy/livekit/livekit.yaml's webhook block, which
      # cannot read environment variables. Pinning it in this one file means
      # there is no pair of values left that can disagree. It is not a secret —
      # it travels in the `iss` claim of every token we mint.
      LIVEKIT_API_KEY: roomkit
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
    expose:
      - '3000'

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
      - livekit
    ports:
      - '80:80'
      - '443:443'
    # livekit runs on the host network, so nginx reaches it through the bridge
    # gateway rather than by service name.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # Host networking, as LiveKit's own deployment guide requires. Publishing
    # the 50000-60000 UDP media range through docker's port mapping spawns one
    # docker-proxy process per port — ten thousand of them — which takes the
    # machine down before the container ever starts.
    network_mode: host
    environment:
      # LiveKit reads its key map from this env var; keeps secrets out of the
      # mounted config file.
      # Same fixed name as the api service above; only the secret comes from
      # .env. LiveKit rejects a secret shorter than 32 characters.
      LIVEKIT_KEYS: 'roomkit: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      # TURN/TLS reuses the certificate certbot issued for the domain.
      - letsencrypt:/etc/letsencrypt:ro
    # No `ports:` — host networking means 7880/7881/5349 and the UDP range are
    # already on the host. Only 7881, 5349 and 50000-60000/udp belong in the
    # firewall; 7880 is signalling and must stay private behind nginx.

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Certbot's own renew is a one-shot; loop it so the container is the cron.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  letsencrypt:
  certbot-www:
