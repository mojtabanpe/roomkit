# Self-hosted LiveKit on the roomkit VPS.
# API keys are NOT here — they come from the LIVEKIT_KEYS env var set in
# compose.prod.yaml, which reads them from /opt/roomkit/.env.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # The VPS has a routable public IP, so let LiveKit advertise it directly
  # rather than guessing from the container's private address.
  use_external_ip: true

# Clients that cannot get out over UDP fall back to TURN. Served over the same
# TCP/443 path is not possible while nginx owns 443, so TURN/TLS listens on 5349
# with the certificate certbot already issued for the domain.
turn:
  enabled: true
  domain: livekit.roomkit.ir
  tls_port: 5349
  cert_file: /etc/letsencrypt/live/roomkit.ir/fullchain.pem
  key_file: /etc/letsencrypt/live/roomkit.ir/privkey.pem

# Usage metering. This is the only source of billable minutes — the browser is
# never trusted for it.
#
# `api_key` is the *name* half of the pair, which is public (it travels in the
# `iss` claim of every token we mint), so unlike the secret it may live here.
# This file gets no environment-variable substitution — LiveKit reads it
# literally — which is why the name is pinned to `roomkit` in compose.prod.yaml
# for both services rather than coming from .env. A name absent from
# LIVEKIT_KEYS is not a silent failure: LiveKit refuses to start and logs
# "api_key is required to use webhooks".
#
# The URL goes back in through nginx on the host because this container runs
# with network_mode: host and cannot resolve the `api` service by name.
webhook:
  api_key: roomkit
  urls:
    - 'https://roomkit.ir/api/livekit/webhook'

# NO `redis:` BLOCK HERE — ON PURPOSE.
#
# Adding one is the only way to use LiveKit Egress for recording, and it is
# also the thing that must never happen on this box. Configuring redis switches
# LiveKit out of single-node mode into *distributed* mode, where redis becomes
# the shared store and message bus for room state — so room creation and
# participant joins start going through it. Redis then sits on the class path:
# if it hiccups, calls stop. That is reported behaviour, not a theory
# (livekit/livekit#2464, #2874, #3536).
#
# Recording therefore has to come from something that joins the room as an
# ordinary participant, so that losing the recorder loses only the recording.
# See docs/platform/README.md → recording.

logging:
  level: info
