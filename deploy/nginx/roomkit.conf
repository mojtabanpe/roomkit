# Edge config for roomkit.ir. Baked into the web image (apps/web/Dockerfile).
# Certificates come from the letsencrypt volume that certbot writes into;
# deploy/init-letsencrypt.sh seeds a self-signed pair so nginx can start before
# the first real certificate exists.

# Docker's embedded DNS, so an api/livekit container restart doesn't leave nginx
# holding a stale IP until it is reloaded.
resolver 127.0.0.11 valid=10s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name roomkit.ir www.roomkit.ir livekit.roomkit.ir;

  # ACME http-01 challenge — must stay reachable over plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.roomkit.ir;

  ssl_certificate     /etc/letsencrypt/live/roomkit.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/roomkit.ir/privkey.pem;

  return 301 https://roomkit.ir$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name roomkit.ir;

  ssl_certificate     /etc/letsencrypt/live/roomkit.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/roomkit.ir/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  # getUserMedia is refused without a secure context; make sure browsers never
  # try the plain-HTTP variant again.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular emits content-hashed filenames (outputHashing: all), so everything
  # under the build output except index.html is safe to cache forever.
  location ~* \.(?:js|css|woff2?|png|svg|jpg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Self-hosted LiveKit: signalling is a websocket, so wss:// terminates here and
# is forwarded to the container. Media travels over the UDP range published
# directly by the livekit service, not through nginx.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name livekit.roomkit.ir;

  ssl_certificate     /etc/letsencrypt/live/roomkit.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/roomkit.ir/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    # Literal, not a variable: livekit uses host networking, so this name comes
    # from the extra_hosts entry in /etc/hosts and nginx must resolve it at
    # startup instead of handing it to the docker resolver.
    proxy_pass http://host.docker.internal:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
